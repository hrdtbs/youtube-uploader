version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    cooldown:
      default-days: 1
    versioning-strategy: increase

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    # GHSA-wrw7-89jp-8q8g needs glib >= 0.20.0, but Tauri 2's Linux stack
    # (gtk 0.18 / webkit2gtk) pins glib to 0.18.x. Bumping requires the
    # GTK4 + WebKitGTK 6 migration (Tauri 3). Until then Dependabot security
    # updates fail with security_update_not_possible and mark CI red.
    ignore:
      - dependency-name: glib

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # dtolnay/rust-toolchain force-pushes floating refs (stable/beta/nightly),
    # so SHA pins become unreachable and Dependabot crashes with
    # "error: no such commit". Track toolchain updates manually instead.
    ignore:
      - dependency-name: dtolnay/rust-toolchain
