packages:
  - '.'

allowBuilds:
  esbuild: true
  lefthook: true
minimumReleaseAge: 1440
# Dependabot cannot unlock these transitive packages via `pnpm update --lockfile-only`.
# Pin patched versions so security updates resolve (see Dependabot security_update_not_possible).
overrides:
  browserslist: 4.29.3
  baseline-browser-mapping: 2.11.28
  postcss-selector-parser: 7.1.6
  source-map-js: 1.2.2
savePrefix: ''
